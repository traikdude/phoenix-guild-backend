<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="phoenixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180404" />
      <stop offset="50%" stop-color="#2d0a0a" />
      <stop offset="100%" stop-color="#090101" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="goldGuild" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#phoenixBg)" />

  <!-- Radiating Empyreal Fire Rays -->
  <g opacity="0.15" stroke="url(#fireGrad)" stroke-width="1.5">
    <line x1="640" y1="280" x2="0" y2="0" />
    <line x1="640" y1="280" x2="320" y2="0" />
    <line x1="640" y1="280" x2="640" y2="0" />
    <line x1="640" y1="280" x2="960" y2="0" />
    <line x1="640" y1="280" x2="1280" y2="0" />
    <circle cx="640" cy="280" r="240" fill="none" stroke-dasharray="10 10" />
  </g>

  <!-- Outer Guild Frame -->
  <rect x="60" y="40" width="1160" height="560" rx="20" fill="none" stroke="#450a0a" stroke-width="2" />
  <rect x="80" y="60" width="1120" height="520" rx="16" fill="#0c0202" stroke="url(#goldGuild)" stroke-width="1.5" opacity="0.95" />

  <!-- Header Banner -->
  <rect x="80" y="60" width="1120" height="48" rx="16" fill="#1f0707" />
  <circle cx="115" cy="84" r="7" fill="#ef4444" />
  <circle cx="138" cy="84" r="7" fill="#f59e0b" />
  <circle cx="161" cy="84" r="7" fill="#10b981" />
  <text x="640" y="90" font-family="'Cinzel', 'Georgia', serif" font-size="14" fill="#fbcfe8" text-anchor="middle" font-weight="700" letter-spacing="3">THE PHOENIX GUILD // EMPYREAL SEEKER PLATFORM</text>

  <!-- Centerpiece: Majestic Phoenix Silhouette & Guild Wings -->
  <g transform="translate(640, 290)">
    <!-- Phoenix Wings Silhouette -->
    <path d="M 0 -110 C -60 -180 -180 -160 -240 -60 C -190 -40 -150 -10 -110 30 C -150 40 -190 70 -220 120 C -170 100 -120 70 -70 50 C -90 90 -100 140 -80 180 C -50 140 -20 90 0 50 C 20 90 50 140 80 180 C 100 140 90 90 70 50 C 120 70 170 100 220 120 C 190 70 150 40 110 30 C 150 -10 190 -40 240 -60 C 180 -160 60 -180 0 -110 Z" fill="url(#fireGrad)" filter="url(#fireGlow)" />
    
    <!-- Guild Crest Crown -->
    <path d="M 0 -130 L -25 -95 L 0 -105 L 25 -95 Z" fill="#fef08a" filter="url(#fireGlow)" />

    <!-- Title Typography -->
    <text x="0" y="150" font-family="'Cinzel', 'Georgia', serif" font-size="36" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3" filter="url(#fireGlow)">PHOENIX GUILD</text>
    <text x="0" y="190" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#f97316" text-anchor="middle" font-weight="700" letter-spacing="4">EMPYREAL SEEKER ASSESSMENT • CLOUD LEDGER • GOOGLE APPS SCRIPT</text>
  </g>

  <!-- Floating Embers -->
  <circle cx="240" cy="220" r="3" fill="#f59e0b" filter="url(#fireGlow)" />
  <circle cx="1040" cy="260" r="3.5" fill="#ea580c" filter="url(#fireGlow)" />
  <circle cx="340" cy="460" r="2" fill="#fbbf24" filter="url(#fireGlow)" />
  <circle cx="920" cy="440" r="2.5" fill="#fef08a" filter="url(#fireGlow)" />
</svg>
